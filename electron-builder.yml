appId: com.groentekaartjes.app
productName: Groente Kaartjes
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
